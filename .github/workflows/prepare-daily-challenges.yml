name: Prepare BLASTOFF daily challenges

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate and validate 90 days of challenges
        run: node scripts/generate-challenges.mjs
      - name: Commit prepared challenge bank
        run: |
          if git diff --quiet -- prepared_challenges.js prepared_challenges.json; then
            echo "Prepared challenges are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add prepared_challenges.js prepared_challenges.json
          git commit -m "Refresh 90-day prepared challenge bank"
          git push
